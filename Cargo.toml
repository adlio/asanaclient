[package]
name = "asanaclient"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/adlio/asanaclient"
description = "Rust SDK for the Asana API"
documentation = "https://docs.rs/asanaclient"
readme = "README.md"
keywords = ["asana", "api", "sdk", "tasks", "projects"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
