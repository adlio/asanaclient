[workspace]
members = ["asanaclient", "asanaclient-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/adlio/asanaclient"

[workspace.dependencies]
# Internal crates
asanaclient = { version = "0.1.0", path = "./asanaclient" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"

# Error handling
thiserror = "2.0"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# MCP
rmcp = { version = "0.11", features = ["server", "transport-io"] }

# Utilities
url = "2.5"

# Testing
tokio-test = "0.4"
wiremock = "0.6"
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
